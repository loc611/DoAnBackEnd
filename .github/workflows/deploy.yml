name: Deploy to Production

on:
  push:
    branches:
      - main # Chạy workflow khi push lên nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build --workspace=client@0.0.0

      # Nếu dùng Docker, bạn có thể thêm các bước build và push Docker image tại đây
