# ==========================================
# Docker Compose - Development Configuration (Live Reload)
# Usage: docker compose -f docker-compose.dev.yml up --build
# ==========================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend_dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://neondb_owner:npg_IKecRfm4o6gZ@ep-aged-silence-azt04b35-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_for_dev_only}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-supersecretkey_refresh_dev}
      - GOOGLE_SHEET_WEBHOOK_URL=${GOOGLE_SHEET_WEBHOOK_URL:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    networks:
      - school_dev_net

  frontend:
    image: node:22-alpine
    container_name: school_frontend_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - backend
    networks:
      - school_dev_net

networks:
  school_dev_net:
    driver: bridge
